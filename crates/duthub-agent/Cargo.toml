[package]
name = "duthub-agent"
description = "UI-free Agent runtime: LLM provider probes, Codex-style PowerShell AST policy, and host orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
duthub-core = { path = "../duthub-core" }
duthub-sandbox = { path = "../duthub-sandbox" }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
