[package]
name = "duthub-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["http2"] }
base64.workspace = true
bytes = "1"
duthub-core = { path = "../duthub-core" }
flate2 = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "server-auto", "service"] }
regex = "1"
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rmcp = { version = "=3.10.0", features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
    "transport-streamable-http-client-reqwest",
    "client",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2 = "0.6"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-std", "io-util", "net", "time", "sync"] }
tower = "0.5"
tower-service = "0.3"
uuid.workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["http2", "rustls-no-provider"] }
rmcp = { version = "=3.10.0", features = ["transport-child-process"] }
tempfile.workspace = true

[[bin]]
name = "duthub-mcp"
path = "src/main.rs"
