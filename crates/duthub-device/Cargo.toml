[package]
name = "duthub-device"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
duthub-core = { path = "../duthub-core" }
async-trait = "0.1"
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }

# 真实串口（D1：serialport-rs 枚举 + tokio-serial 读写）
tracing = "0.1"
tokio-serial = { version = "5", optional = true }

# 终端仿真（PuTTY 模式）：串口字节流进 Term 网格，回显/提示符/ANSI 由设备 shell 负责
alacritty_terminal = "0.26"

[features]
default = []
real-hardware = ["dep:tokio-serial"]
