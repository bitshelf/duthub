# Build the duthub Windows release.
# Build Windows artifacts on main and publish tagged versions to GitHub Releases.
#
# Release gate (ADR-3 §9, download-only goose distribution since 2026-11-25).
# Publishing requires a passing gate, RELEASE_GATE=true, and a release environment.
# Third-party actions are pinned to commit SHAs. git ls-remote verified these refs on
# 2026-11-21: checkout v4.4.0, rust-toolchain stable head, and rust-cache v2.
# The remaining refs were upload-artifact v4.6.2, download-artifact v4.3.0, and gh-release v2.6.2.
# When updating, verify the new SHA and record the result in the commit message.

name: Release (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch head
        with:
          toolchain: stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      # The GPUI build script needs fxc.exe, the HLSL compiler.
      # The SDK 22621 path in .cargo/config.toml is specific to the development host.
      # The build script checks GPUI_FXC_PATH, PATH, then SDK 26100.
      # Discover the installed compiler and set an environment override on the runner.
      - name: Locate fxc.exe (HLSL compiler)
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $fxc) { Write-Error "fxc.exe not found in Windows Kits"; exit 1 }
          Write-Host "Using fxc: $fxc"
          "GPUI_FXC_PATH=$fxc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify goose is not embedded (download distribution)
        shell: pwsh
        # ADR-3 §9 has prohibited bundling goose since 2026-11-25.
        # Fail before building if bundled assets return. Verify the download distribution
        # spec and provenance so this gate continues to check the published contract.
        # The former size and SHA-256 checks targeted the deleted assets/goose tree (#110).
        run: |
          function Fail([string]$Message) { Write-Error $Message; exit 1 }
          $assets = "apps/desktop/assets/goose"
          if (Test-Path -LiteralPath $assets) {
            Fail "embedded goose assets reappeared at $assets; ADR-3 §9 says goose is downloaded, not bundled"
          }
          $bundle = Get-Content "apps/desktop/src/agent_host/bundle.rs" -Raw -Encoding UTF8
          foreach ($forbidden in @("include_bytes!", "include_str!", "assets/goose")) {
            if ($bundle.Contains($forbidden)) { Fail "bundle.rs must not embed goose assets (found $forbidden)" }
          }
          $spec = Get-Content "crates/duthub-tooldown/src/spec.rs" -Raw -Encoding UTF8
          if ($spec -notmatch '(?ms)pub const TOOL_GOOSE: ToolSpec = ToolSpec \{.*?\n\};') {
            Fail "TOOL_GOOSE spec missing from duthub-tooldown"
          }
          if ($spec -notmatch '&TOOL_GOOSE') { Fail "TOOL_GOOSE not registered in builtin_specs()" }
          if (-not (Test-Path -LiteralPath "NOTICE" -PathType Leaf)) { Fail "NOTICE missing" }
          if (-not (Test-Path -LiteralPath "apps/desktop/assets/goose-distribution.md" -PathType Leaf)) {
            Fail "goose provenance statement missing"
          }
          Write-Host "goose is not embedded; download-distribution contract present"

      - name: Build release (no-console + real-hardware, static CRT)
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release -p duthub-desktop --bin duthub

      - name: Smoke test (--self-test, informational)
        shell: pwsh
        # GPUI may fail to create a window on a headless GitHub runner without a GPU.
        # The self-test passed locally. Report the runner outcome without blocking release.
        run: |
          & .\target\release\duthub.exe --self-test
          Write-Host "self-test exit code: $LASTEXITCODE（runner 无显示环境时可能非 0，属预期）"
          exit 0

      - name: Stage artifact
        shell: pwsh
        # Distribute duthub.exe as a single executable with license and provenance files alongside.
        # Users install goose from Tool Downloads. Include its PROVENANCE.md with the release.
        # The old assets/goose license, notice, and manifest are no longer in the tree.
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item .\target\release\duthub.exe .\dist\duthub.exe
          New-Item -ItemType Directory -Force -Path dist\licenses\duthub | Out-Null
          Copy-Item LICENSE dist\licenses\duthub\LICENSE
          Copy-Item NOTICE dist\licenses\duthub\NOTICE
          New-Item -ItemType Directory -Force -Path dist\licenses\goose | Out-Null
          Copy-Item apps\desktop\assets\goose-distribution.md dist\licenses\goose\PROVENANCE.md
          Get-ChildItem -Recurse dist | Select-Object FullName, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: duthub-windows-x64
          path: |
            dist/duthub.exe
            dist/licenses/**
          if-no-files-found: error

  regression:
    # CLI Agent integration tests require the native PSEC backend on Windows 11.
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch head
        with:
          toolchain: stable-aarch64-pc-windows-msvc

      - name: Rust build cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Locate fxc.exe (HLSL compiler)
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $fxc) { Write-Error "fxc.exe not found in Windows Kits"; exit 1 }
          Write-Host "Using fxc: $fxc"
          "GPUI_FXC_PATH=$fxc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set a dedicated test temporary directory
        shell: pwsh
        # Give test fixtures a stable path instead of the runner account short-name alias.
        run: |
          $testTemp = Join-Path $env:RUNNER_TEMP 'duthub-tests'
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          "TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test (workspace)
        id: workspace_tests
        shell: pwsh
        # Unauthenticated viewers cannot read runner logs. Put failing test names in public
        # check annotations and the step summary so failures can be identified.
        run: |
          cargo test --locked --workspace --no-fail-fast -- --skip cli_stop_kills_process_tree 2>&1 | Tee-Object -FilePath test-workspace.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines = Get-Content test-workspace.log
            $failed = @()
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i].Trim() -eq 'failures:') {
                for ($j = $i + 1; $j -lt [Math]::Min($i + 80, $lines.Count); $j++) {
                  if ($lines[$j] -cmatch '^    ([A-Za-z0-9_][A-Za-z0-9_:]*)$') { $failed += $Matches[1] }
                  elseif ($lines[$j].Trim() -eq '' -or $lines[$j] -match '^test result:') { break }
                }
              }
            }
            $msg = ($failed | Select-Object -Unique) -join ', '
            if ([string]::IsNullOrWhiteSpace($msg)) { $msg = 'cargo test failed; see step log' }
            if ($msg.Length -gt 900) { $msg = $msg.Substring(0, 900) }
            Write-Host "::error title=Workspace tests failed::$msg"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### cargo test --workspace failed"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('```' + "`n" + $msg + "`n" + '```')
          }
          exit $code

      - name: Verify sandbox process-tree shutdown
        if: ${{ !cancelled() && (steps.workspace_tests.outcome == 'success' || steps.workspace_tests.outcome == 'failure') }}
        shell: pwsh
        # Run the subprocess heartbeat fixture without other Agent CLI tests competing.
        run: cargo test --locked --workspace --test agent_cli -- cli_stop_kills_process_tree --exact --nocapture

  # Keep release artifact verification on the x64 Windows image.
  gate:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch head
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust build cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Locate fxc.exe (HLSL compiler)
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $fxc) { Write-Error "fxc.exe not found in Windows Kits"; exit 1 }
          Write-Host "Using fxc: $fxc"
          "GPUI_FXC_PATH=$fxc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download release artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: duthub-windows-x64
          path: dist

      - name: Format check
        shell: pwsh
        run: cargo fmt --all --check

      - name: Clippy (workspace, all targets and features, deny warnings)
        shell: pwsh
        env:
          CARGO_BUILD_WARNINGS: deny
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Desktop self-test (informational on headless runner)
        shell: pwsh
        # This is the optional fourth step of scripts/regression. A headless runner may exit
        # nonzero. Report that outcome and run the window acceptance check locally.
        continue-on-error: true
        run: |
          & .\dist\duthub.exe --self-test
          Write-Host "self-test exit code: $LASTEXITCODE"

      - name: Install release-gate tools (community)
        shell: pwsh
        # Use community tooling for supply-chain checks and SBOM generation.
        run: cargo install --locked cargo-cyclonedx@0.5.10 cargo-audit@0.23.0

      - name: Generate CycloneDX SBOM (duthub)
        shell: pwsh
        # Pass the base name duthub.cdx to --override-filename. The JSON writer appends .json.
        # The resulting file is apps/desktop/duthub.cdx.json, which Copy-Item and the gate expect.
        # Including .json in the base name would produce an extra extension.
        run: |
          New-Item -ItemType Directory -Force -Path dist\sbom | Out-Null
          cargo cyclonedx --format json --spec-version 1.7 --manifest-path apps/desktop/Cargo.toml --no-build-deps --override-filename duthub.cdx
          Copy-Item apps\desktop\duthub.cdx.json dist\sbom\duthub.cdx.json

      - name: Audit duthub dependencies
        shell: pwsh
        # cargo audit exits nonzero on an advisory or error. Capture its exit code in audit-exit
        # and let release-gate.ps1 evaluate the outcome after artifacts have been written.
        # A pass requires both exit code zero and a JSON report without vulnerabilities.
        run: |
          cargo audit --file Cargo.lock --json > dist\sbom\audit.json
          $code = $LASTEXITCODE
          Set-Content -LiteralPath dist\sbom\audit-exit.txt -Value "$code" -NoNewline
          Write-Host "cargo audit (duthub) exit code: $code (JSON captured; gate decides)"
          exit 0

      - name: Record goose runtime dependency audit status (placeholder)
        shell: pwsh
        # ADR-3 §9 moved goose to download distribution. The bundled Cargo.lock was removed.
        # If the bundled lockfile reappears, restore the fail-closed upstream lockfile audit.
        # For download distribution, record the upstream audit status explicitly as UNVERIFIED.
        # release-gate.ps1 requires the status file and its UNVERIFIED prefix.
        run: |
          New-Item -ItemType Directory -Force -Path dist\sbom | Out-Null
          $lock = "apps\desktop\assets\goose\Cargo.lock"
          if (Test-Path -LiteralPath $lock -PathType Leaf) {
            cargo audit --file $lock --json > dist\sbom\audit-goose.json
            $code = $LASTEXITCODE
            Set-Content -LiteralPath dist\sbom\audit-goose-exit.txt -Value "$code" -NoNewline
            Write-Host "embedded goose Cargo.lock found; cargo audit exit code: $code (gate decides)"
          } else {
            $status = "UNVERIFIED: goose is not bundled; no goose Cargo.lock is audited at release time (ADR-3 §9). goose runtime dependencies are the upstream release's responsibility; duthub records the measured archive SHA-256 with checksumVerified: false."
            Set-Content -LiteralPath dist\sbom\goose-audit-status.txt -Value $status -NoNewline
            Write-Host "::notice::$status"
          }
          exit 0

      - name: Release gate (signature, hashes, SBOM, audit, checksums)
        shell: pwsh
        # Until a code-signing certificate is configured, -AllowUnsigned reports a warning.
        # Record the actual signature status and restore enforcement when signtool is configured.
        run: |
          $gateArgs = @('-NoProfile', '-File', 'scripts/release-gate.ps1', '-RepoRoot', '.', '-AllowUnsigned')
          pwsh @gateArgs

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: duthub-release-gate
          path: |
            dist/sbom/**
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: warn

  publish-release:
    if: github.ref_type == 'tag' && vars.RELEASE_GATE == 'true'
    needs: [build-windows, regression, gate]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: duthub-windows-x64
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: duthub-release-gate
          path: dist
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            dist/duthub.exe
            dist/licenses/duthub/LICENSE
            dist/licenses/duthub/NOTICE
            dist/licenses/goose/PROVENANCE.md
            dist/SHA256SUMS
            dist/sbom/*
