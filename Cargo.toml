[workspace]
resolver = "3"
members = [
    "crates/duthub-core",
    "crates/duthub-sandbox",
    "crates/duthub-device",
    "crates/duthub-adb",
    "crates/duthub-control",
    "crates/duthub-flash",
    "crates/duthub-mcp",
    "crates/duthub-a2a",
    "crates/duthub-agent",
    "crates/duthub-transfer",
    "crates/duthub-tooldown",
    "apps/desktop",
]
# Exclude standalone local reference crate.
exclude = ["docs/rust-reference"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
future_incompatible = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
await_holding_lock = "deny"
dbg_macro = "warn"
collection_is_never_read = "warn"
inefficient_to_string = "warn"
flat_map_option = "warn"
# Internal workspace crates and GPUI renderers: keep pedantic active for all
# correctness/idiom/safety/ownership lints while exempting boilerplate doc
# sections and UI render-function length thresholds.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"

[workspace.dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui-kit = "0.9.1"
mxc-sdk = { version = "1.1.0", default-features = false }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-serial = "5"
tracing = "0.1"
tracing-chrome = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
zerocopy = { version = "0.8", features = ["derive"] }

[profile.dev]
# Line-tables-only debuginfo preserves backtraces while cutting Windows PDB size
# and link time significantly in the shared repository target/ directory.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
